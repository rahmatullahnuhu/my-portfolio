<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rahmatullah Nuhu Portfolio</title>
  <meta name="claude:viewport-fit-sides" content="cover">

  <!-- Favicon (orange circle with white R) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ff8a4c'/%3E%3Ctext x='50' y='70' font-family='Georgia,serif' font-size='60' font-weight='400' fill='%23ffffff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">

  <!-- Base reset styles (from original) -->
  <style>
    :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
    img{max-width:100%}
    [hidden]:not([hidden=until-found i]){display:none!important}
  </style>

  <style>
    /* Layout: dark editorial portfolio. Full-width aligned nav with scroll progress line, hero with portrait behind a huge name, stats strip, perspective tabs, numbered project view, process, impact, contact, rich footer. Single committed dark look. */
    :root{
      --ink:#0a0908; --ink2:#131110; --paper:#f1ebe0; --mut:rgba(241,235,224,.64); --dim:rgba(241,235,224,.4);
      --line:rgba(241,235,224,.14); --sig:#ff8a4c; --sigsoft:rgba(255,138,76,.14);
      --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
      --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
      --g:clamp(1.25rem,4vw,4rem);
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--ink);overflow-x:clip}
    body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;
      padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
    body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--sig);outline-offset:3px;border-radius:4px}
    h1,h2,h3,h4,p{margin:0}
    h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;text-wrap:balance}
    em{font-style:italic}
    .wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(0px,1vw,16px)}
    .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
    .eyebrow b{color:var(--sig);font-weight:500}
    .sec{padding-block:clamp(5rem,11vw,10rem);border-top:1px solid var(--line)}
    .sh{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:clamp(2.5rem,5vw,4.5rem)}
    .h2{font-size:clamp(2.6rem,7vw,6rem);line-height:.98}
    .h2 em{color:var(--sig)}
    .lead{color:var(--mut);max-width:34rem;font-size:1.05rem}

    /* motion */
    .rv{opacity:1;transform:none}
    .rvon .rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
    .rvon .rv.in{opacity:1;transform:none}
    [data-motion="off"] *,[data-motion="off"] *::before{animation:none!important;transition:none!important}
    @media (prefers-reduced-motion:reduce){.rvon .rv{opacity:1;transform:none;transition:none}*{animation:none!important;scroll-behavior:auto!important}}

    /* nav */
    .nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:50;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}

    .prog{position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--sig),#ffc08f);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
    .nin{pointer-events:auto;position:relative;overflow:hidden;max-width:1232px;margin:0 auto;height:74px;padding:0 18px 0 clamp(20px,2.6vw,34px);display:flex;align-items:center;justify-content:space-between;gap:1.5rem;border:1px solid rgba(241,235,224,.15);border-radius:26px;background:linear-gradient(180deg,rgba(44,40,36,.78),rgba(22,20,18,.84));backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.5)}
    .cta{display:inline-flex;align-items:center;gap:1.5rem;padding:.8rem 1.2rem;border-radius:14px;background:rgba(241,235,224,.1);border:1px solid rgba(241,235,224,.22);color:var(--paper);font-size:.95rem;transition:background .3s,border-color .3s}
    .cta:hover{background:var(--sig);border-color:var(--sig);color:var(--ink)}
    .cta span{display:inline-block;transition:transform .4s var(--ease)}.cta:hover span{transform:translate(2px,-2px)}
    .logo{font-family:var(--serif);font-size:clamp(1.45rem,2.2vw,1.9rem);letter-spacing:-.02em;white-space:nowrap}
    .logo em{color:var(--sig)}
    .nl{display:flex;gap:clamp(1.4rem,2.6vw,2.6rem);font-size:.95rem;color:var(--paper);margin-left:auto;margin-right:1.4rem}
    .nl a:hover{color:var(--paper)}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.25rem;border-radius:999px;font-size:.88rem;font-weight:500;border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s;cursor:pointer;font-family:inherit;color:var(--paper);background:transparent}
    .btn.p{background:var(--paper);color:var(--ink);border-color:var(--paper)}
    .btn.p:hover{background:var(--sig);border-color:var(--sig)}
    .btn:not(.p):hover{border-color:var(--paper)}
    .nav .btn{padding:.6rem 1.15rem}
    .mb{display:none;background:none;border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:.45rem .9rem;font:inherit;font-size:.82rem;cursor:pointer}
    @media (max-width:720px){.nl{display:none}.mb{display:block}.nin{height:auto;min-height:62px;flex-wrap:wrap;gap:.8rem;padding:11px 14px 11px 20px}.nav .cta{display:none}.mb{margin-left:auto}
      .nav.open .nl{display:flex;flex-direction:column;width:100%;gap:1rem;padding:.6rem 0 1rem;order:5;font-size:1.05rem;margin:0}.nav.open .cta{display:inline-flex;order:6;width:100%;justify-content:space-between}}

    /* hero */

    .hero{position:relative;text-align:center}
    .hero .tag{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 7.3rem);left:0;right:0;display:flex;justify-content:space-between;gap:1rem;text-align:left;flex-wrap:wrap}
    .hero{cursor:none}.hero a,.hero button{cursor:pointer}
    .fig{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:clamp(500px,90svh,880px);pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 62%,transparent 100%)}
    .fig img,.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .fig img{opacity:0}
    .fig canvas{opacity:0;transition:opacity .8s ease}.fig canvas.ready{opacity:1}
    .fig::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0,transparent 20%,transparent 80%,var(--ink) 100%)}
    .fig::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(45% 60% at 50% 40%,rgba(255,138,76,.16),transparent 70%)}
    .cursor{position:fixed;left:0;top:0;z-index:70;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--sig);opacity:0;transition:opacity .25s}
    .cursor.on{opacity:1}
    @media (hover:none){.cursor{display:none}.hero{cursor:auto}}
    .hintrow{display:flex;justify-content:center;align-items:center;gap:.55rem;margin-top:1.2rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
    .hintrow i{width:8px;height:8px;border-radius:50%;background:var(--sig)}
    .hn{position:relative;margin-top:calc(-1 * clamp(6rem,15vw,13rem));z-index:2;font-size:clamp(3.2rem,12.5vw,11.5rem);line-height:.9;letter-spacing:-.035em;text-wrap:balance}
    .hn em{color:var(--sig)}
    .hs{max-width:36rem;margin:1.75rem auto 0;color:var(--mut);font-size:1.1rem}
    .ctas{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(3.5rem,7vw,6rem);border-top:1px solid var(--line);text-align:left}
    .stat{padding:1.6rem 1.25rem 1.8rem 0;border-right:1px solid var(--line);padding-left:1.25rem}
    .stat:first-child{padding-left:0}.stat:last-child{border-right:0}
    .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,5vw,4rem);line-height:1}
    .stat b i{font-style:normal;color:var(--sig)}
    .stat span{display:block;margin-top:.5rem;font-size:.85rem;color:var(--mut);max-width:16rem}
    @media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid var(--line)}.stat:nth-child(2n){border-right:0}.stat:nth-child(odd){padding-left:0}.stat:nth-child(even){padding-left:1.25rem}}

    /* marquee */
    .mq{border-block:1px solid var(--line);overflow:hidden;padding-block:1.1rem;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
    .mt{display:flex;gap:3rem;width:max-content;animation:mq 34s linear infinite;font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.4rem);color:var(--dim)}
    .mt span{white-space:nowrap}.mt span::after{content:"✦";margin-left:3rem;color:var(--sig);font-size:.8em}
    @keyframes mq{to{transform:translateX(-50%)}}

    /* about */
    .ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);align-items:start}
    .abl{display:grid}
    .stk{position:sticky;top:7.6rem}
    .rub{width:clamp(130px,17vw,240px);margin:1.5rem 0 0 auto;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 45%,transparent 100%)}
    .rub img{display:block;width:100%}
    .chap{min-height:64vh;display:flex;flex-direction:column;justify-content:center;gap:1rem;border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);padding-top:clamp(2rem,6vh,4rem);transition:opacity .6s}
    .chap h3{font-size:clamp(2rem,4vw,3.4rem);line-height:1.02}
    .chap p:last-child{color:var(--mut);max-width:30rem}
    .rvon .chap{opacity:.28}.rvon .chap.on{opacity:1}
    .ab p{color:var(--mut);margin-top:1.25rem;max-width:34rem}
    .ab p strong{color:var(--paper);font-weight:500}
    .tabs{border:1px solid var(--line);border-radius:18px;background:var(--ink2);overflow:hidden}
    .tl{display:flex;border-bottom:1px solid var(--line)}
    .tl button{flex:1;padding:1rem .5rem;background:none;border:0;color:var(--mut);font:inherit;font-size:.86rem;cursor:pointer;border-right:1px solid var(--line);transition:color .3s,background .3s}
    .tl button:last-child{border-right:0}
    .tl button[aria-selected="true"]{color:var(--ink);background:var(--paper)}
    .tp{padding:clamp(1.4rem,3vw,2.2rem)}
    .tp[hidden]{display:none}
    .tp h3{font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.05}
    .tp p{margin-top:.9rem;color:var(--mut)}
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem;padding:0;list-style:none}
    .chips li{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;padding:.4rem .8rem;border:1px solid var(--line);border-radius:999px;color:var(--paper)}
    @media (max-width:860px){.ab{grid-template-columns:1fr}.stk{position:static;order:-1}.rub{display:none}.chap{min-height:0;opacity:1!important}}

    /* work */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2.5rem,5vw,4.5rem) clamp(1.5rem,3vw,3rem)}
    .card{display:block}
    .card.big{grid-column:1/-1}
    .shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b0b10;transition:border-color .4s}
    .card:hover .shot{border-color:rgba(255,138,76,.5)}
    .bar{display:flex;align-items:center;gap:.4rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);background:#0e0e14}
    .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
    .bar span{margin-left:.8rem;font-family:var(--mono);font-size:.68rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .scr{position:relative;aspect-ratio:16/9;overflow:hidden;padding:clamp(.8rem,2vw,1.6rem);display:flex;flex-direction:column;justify-content:space-between;
      background:radial-gradient(90% 120% at 85% 10%,hsl(var(--h) 55% 38% / .75),transparent 60%),linear-gradient(160deg,hsl(var(--h) 30% 14%),#09090d)}
    .card.big .scr{aspect-ratio:21/9}
    .nv{display:flex;align-items:center;gap:.6rem}
    .nv b{width:3.2rem;height:.5rem;border-radius:9px;background:hsl(var(--h) 40% 85% / .85);margin-right:auto}
    .nv u{width:1.6rem;height:.28rem;border-radius:9px;background:hsl(var(--h) 20% 90% / .35)}
    .hr{position:relative;z-index:1;max-width:60%}
    .hr small{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--h) 30% 85% / .7)}
    .hr h4{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,3.6vw,2.8rem);line-height:1;margin-top:.4rem;color:hsl(var(--h) 30% 94%)}
    .hr em{display:inline-block;margin-top:.8rem;font-style:normal;font-size:.62rem;padding:.3rem .8rem;border-radius:99px;background:hsl(var(--h) 40% 88%);color:#111}
    .orb{position:absolute;right:8%;bottom:-20%;width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,hsl(var(--h) 60% 70% / .9),hsl(var(--h) 55% 30% / .5) 55%,transparent 72%)}
    .v-b .orb{border-radius:14px 14px 0 0;bottom:0;right:6%;width:32%;aspect-ratio:3/4;transform:none;background:linear-gradient(180deg,hsl(var(--h) 50% 65% / .7),hsl(var(--h) 40% 25% / .4))}
    .v-c .orb{border-radius:0;width:55%;right:-6%;bottom:-30%;transform:rotate(18deg);aspect-ratio:1.3;background:linear-gradient(135deg,hsl(var(--h) 55% 62% / .75),transparent 70%)}
    .meta{display:flex;align-items:center;gap:1rem;margin-top:1.2rem;flex-wrap:wrap}
    .idx{font-family:var(--mono);font-size:.74rem;color:var(--sig)}
    .cat{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
    .pw{font-family:var(--mono);font-size:.68rem;padding:.2rem .6rem;border:1px dashed var(--line);border-radius:99px;color:var(--mut)}
    .card h3{font-size:clamp(1.9rem,3.6vw,3rem);line-height:1;margin-top:.6rem}
    .lk{margin-top:.8rem;font-size:.9rem;color:var(--mut);transition:color .3s}
    .lk span{display:inline-block;transition:transform .4s var(--ease)}
    .card:hover .lk{color:var(--sig)}.card:hover .lk span{transform:translate(3px,-3px)}
    .more{margin-top:clamp(3rem,6vw,5rem)}
    .row{position:relative;display:grid;grid-template-columns:3rem 1fr auto 2rem;align-items:center;gap:1rem;padding:1.7rem 0;border-top:1px solid var(--line);transition:padding .5s var(--ease)}
    .row:last-child{border-bottom:1px solid var(--line)}
    .row h3{font-size:clamp(1.6rem,3vw,2.4rem);transition:color .3s}
    .row .ar{font-size:1.2rem;color:var(--mut);transition:transform .4s var(--ease),color .3s}
    .row:hover{padding-left:.6rem}.row:hover h3,.row:hover .ar{color:var(--sig)}.row:hover .ar{transform:translate(3px,-3px)}
    .pv{position:absolute;right:6rem;top:50%;width:240px;transform:translateY(-50%) scale(.92);opacity:0;pointer-events:none;transition:opacity .35s,transform .5s var(--ease);z-index:3;box-shadow:0 30px 60px rgba(0,0,0,.6);border-radius:14px}
    .pv .scr{aspect-ratio:16/10}.pv .hr h4{font-size:1.2rem}
    @media (hover:hover) and (min-width:861px){.row:hover .pv{opacity:1;transform:translateY(-50%) scale(1)}}
    @media (max-width:860px){.grid{grid-template-columns:1fr}.row{grid-template-columns:2.2rem 1fr 1.5rem}.row .cat{grid-column:2/3;grid-row:2}.pv{display:none}}
    .mnote{margin-top:2.2rem;color:var(--dim);font-size:.85rem;max-width:36rem}

    /* process */
    .pr{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem)}
    .steps{list-style:none;padding:0;margin:2.2rem 0 0;display:grid;gap:0}
    .steps li{display:flex;gap:1.2rem;align-items:baseline;padding:1.2rem 0;border-top:1px solid var(--line);font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2rem)}
    .steps li:last-child{border-bottom:1px solid var(--line)}
    .steps small{font-family:var(--mono);font-size:.72rem;color:var(--sig)}
    .pn{border-top:1px solid var(--line);padding:1.8rem 0}
    .pn:first-child{border-top:0;padding-top:0}
    .pn h3{font-size:clamp(1.7rem,3vw,2.4rem)}
    .pn p{margin-top:.6rem;color:var(--mut);max-width:30rem}
    @media (max-width:860px){.pr{grid-template-columns:1fr}}

    /* impact */
    .big-n{font-family:var(--serif);font-size:clamp(5rem,18vw,15rem);line-height:.9;letter-spacing:-.04em}
    .big-n i{color:var(--sig);font-style:normal}
    .im{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:clamp(2.5rem,5vw,4rem);border-top:1px solid var(--line);padding-top:2rem}
    .im b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(3rem,6vw,5rem);line-height:1}
    .im b i{color:var(--sig);font-style:normal}
    .im span{display:block;margin-top:.5rem;color:var(--mut);font-size:.92rem;max-width:18rem}
    @media (max-width:760px){.im{grid-template-columns:1fr 1fr}}

    /* experience */
    .tm{list-style:none;padding:0;margin:0;display:grid}
    .tm li{display:grid;grid-template-columns:minmax(8rem,16rem) 1fr;gap:1.5rem;padding:2rem 0;border-top:1px solid var(--line)}
    .tm li:last-child{border-bottom:1px solid var(--line)}
    .tm time{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sig)}
    .tm h3{font-size:clamp(1.7rem,3vw,2.5rem)}
    .tm p{margin-top:.5rem;color:var(--mut);max-width:34rem}
    @media (max-width:640px){.tm li{grid-template-columns:1fr;gap:.5rem}}

    /* contact */
    .ct{text-align:center;position:relative}
    .ct h2{font-size:clamp(3rem,10.5vw,9.5rem);line-height:.92;letter-spacing:-.035em}
    .ct h2 em{color:var(--sig)}
    .ct .lead{margin:1.8rem auto 0}
    .mail{margin-top:1.4rem;font-family:var(--mono);font-size:.9rem;color:var(--mut);user-select:all}
    .cp{margin-left:.6rem;font:inherit;font-size:.74rem;color:var(--paper);background:none;border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem;cursor:pointer}
    .cp:hover{border-color:var(--paper)}

    /* footer */
    .ft{border-top:1px solid var(--line);padding-block:clamp(3rem,6vw,5rem) 2rem}
    .fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:2.5rem}
    .fg h5{margin:0 0 1rem;font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    .fg ul{list-style:none;margin:0;padding:0;display:grid;gap:.55rem;font-size:.92rem;color:var(--mut)}
    .fg a:hover{color:var(--sig)}
    .fb{font-family:var(--serif);font-size:clamp(2rem,4vw,3rem);line-height:1}
    .fb em{color:var(--sig)}
    .fg p{margin-top:.9rem;color:var(--mut);font-size:.92rem;max-width:22rem}
    .fl{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:clamp(3rem,6vw,5rem);padding-top:1.5rem;border-top:1px solid var(--line);font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--dim)}
